name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at UTC midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: SUBRAHMANYA2726
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          mkdir -p assets/images
          cp dist/github-contribution-grid-snake.svg assets/images/contribution-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/images/contribution-snake-dark.svg
          git add assets/images/contribution-snake.svg assets/images/contribution-snake-dark.svg
          git commit -m "🐍 Update contribution snake SVG"
          git push